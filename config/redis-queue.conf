# Redis Queue Configuration for Production
# Optimized for queue operations - no data loss

# Persistencia AOF (Append Only File)
# AOF es crítico para queues - no podemos perder trabajos
appendonly yes
appendfsync always

# Eviction Policy
# Limitar memoria para evitar OOM
maxmemory 256mb
# NO eliminar keys - mejor que fallen las escrituras que perder trabajos
maxmemory-policy noeviction

# RDB (Redis Database Backup)
# Mantener RDB como backup adicional para queues
save 3600 1

# Performance
# Comprimir AOF cuando sea necesario
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Logging
loglevel notice
