# Redis Cache Configuration for Production
# Optimized for cache operations with LRU eviction

# Persistencia AOF (Append Only File)
# AOF es más seguro que RDB para cache crítico
appendonly yes
appendfsync everysec

# Eviction Policy
# Limitar memoria para evitar OOM
maxmemory 512mb
# Eliminar keys menos usados cuando se llena (LRU)
maxmemory-policy allkeys-lru

# RDB (Redis Database Backup)
# Deshabilitar RDB ya que usamos AOF
save ""

# Performance
# Comprimir AOF cuando sea necesario
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Logging
loglevel notice
