groups:
  - name: barriofarma-infra
    rules:
      - alert: SiteDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Sitio no responde (blackbox probe)"
          description: "probe_success=0 para {{ $labels.instance }}"

      - alert: MariaDBDown
        expr: mysql_up{job="mariadb"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MariaDB exporter reporta mysql_up=0"

      - alert: DiskSpaceWarning
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} /
           node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) < 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disco VM por debajo del 15% libre"
          description: "mountpoint={{ $labels.mountpoint }}"

      - alert: RedisMemoryHigh
        expr: |
          (redis_memory_used_bytes / redis_memory_max_bytes) > 0.9
          and redis_memory_max_bytes > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memoria > 90%"
          description: "instance={{ $labels.instance }}"

      - alert: BackupStale
        expr: backup_last_success_age_seconds > 93600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Backup GCS sin actualizar > 26h"
          description: "Ultimo backup hace {{ $value | humanizeDuration }}"
