apiVersion: apps/v1
kind: Deployment
metadata:
  name: barriofarma-backend
  namespace: barriofarma
  labels:
    app.kubernetes.io/name: barriofarma
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: "0.0.2-dev"
spec:
  replicas: 1  # Dev: 1 réplica, Production: escalar según carga
  selector:
    matchLabels:
      app.kubernetes.io/name: barriofarma
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: barriofarma
        app.kubernetes.io/component: backend
        app.kubernetes.io/version: "0.0.2-dev"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
      # Verificar que Cloud SQL MariaDB está accesible
      - name: wait-for-db
        image: mariadb:11.8
        command: ['sh', '-c', 'until mariadb-admin --skip-ssl ping -h "$DB_HOST" -u barriofarma -p"$DB_PASSWORD" --silent 2>/dev/null || mariadb --skip-ssl -h "$DB_HOST" -u barriofarma -p"$DB_PASSWORD" -e "SELECT 1" 2>/dev/null; do echo waiting for database; sleep 2; done;']
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: barriofarma-config
              key: DB_HOST
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: barriofarma-secrets
              key: DB_PASSWORD
      # Verificar que Redis Cache está accesible
      - name: wait-for-redis-cache
        image: redis:7.2-alpine
        command: ['sh', '-c', 'REDIS_HOST=$(echo $FRAPPE_REDIS_CACHE | sed "s|redis://||" | cut -d: -f1); REDIS_PORT=$(echo $FRAPPE_REDIS_CACHE | sed "s|redis://||" | cut -d: -f2); until redis-cli -h $REDIS_HOST -p $REDIS_PORT ping; do echo waiting for redis-cache; sleep 2; done;']
        env:
        - name: FRAPPE_REDIS_CACHE
          valueFrom:
            configMapKeyRef:
              name: barriofarma-config
              key: FRAPPE_REDIS_CACHE
      # Verificar que Redis Queue está accesible
      - name: wait-for-redis-queue
        image: redis:7.2-alpine
        command: ['sh', '-c', 'REDIS_HOST=$(echo $FRAPPE_REDIS_QUEUE | sed "s|redis://||" | cut -d: -f1); REDIS_PORT=$(echo $FRAPPE_REDIS_QUEUE | sed "s|redis://||" | cut -d: -f2); until redis-cli -h $REDIS_HOST -p $REDIS_PORT ping; do echo waiting for redis-queue; sleep 2; done;']
        env:
        - name: FRAPPE_REDIS_QUEUE
          valueFrom:
            configMapKeyRef:
              name: barriofarma-config
              key: FRAPPE_REDIS_QUEUE
      containers:
      - name: backend
        image: gcr.io/barriofarma-dev/bf-app-dev:0.0.2-dev
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 9090
          name: metrics
        env:
        - name: FRAPPE_SITE_NAME
          valueFrom:
            configMapKeyRef:
              name: barriofarma-config
              key: FRAPPE_SITE_NAME
        - name: FRAPPE_REDIS_CACHE
          valueFrom:
            configMapKeyRef:
              name: barriofarma-config
              key: FRAPPE_REDIS_CACHE
        - name: FRAPPE_REDIS_QUEUE
          valueFrom:
            configMapKeyRef:
              name: barriofarma-config
              key: FRAPPE_REDIS_QUEUE
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: barriofarma-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: barriofarma-config
              key: DB_PORT
        - name: DB_TYPE
          valueFrom:
            configMapKeyRef:
              name: barriofarma-config
              key: DB_TYPE
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: barriofarma-config
              key: DB_NAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: barriofarma-secrets
              key: DB_PASSWORD
        - name: OTEL_SERVICE_NAME
          valueFrom:
            configMapKeyRef:
              name: barriofarma-config
              key: OTEL_SERVICE_NAME
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: barriofarma-config
              key: OTEL_EXPORTER_OTLP_ENDPOINT
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          valueFrom:
            configMapKeyRef:
              name: barriofarma-config
              key: OTEL_EXPORTER_OTLP_PROTOCOL
        - name: METRICS_ENABLED
          valueFrom:
            configMapKeyRef:
              name: barriofarma-config
              key: METRICS_ENABLED
        - name: METRICS_PORT
          valueFrom:
            configMapKeyRef:
              name: barriofarma-config
              key: METRICS_PORT
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /api/method/ping
            port: 8000
            httpHeaders:
            - name: X-Frappe-Site-Name
              value: frontend
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/method/ping
            port: 8000
            httpHeaders:
            - name: X-Frappe-Site-Name
              value: frontend
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - name: sites-data
          mountPath: /home/frappe/frappe-bench/sites
        - name: logs-data
          mountPath: /home/frappe/frappe-bench/logs
      volumes:
      - name: sites-data
        persistentVolumeClaim:
          claimName: barriofarma-sites-pvc
      - name: logs-data
        persistentVolumeClaim:
          claimName: barriofarma-logs-pvc
