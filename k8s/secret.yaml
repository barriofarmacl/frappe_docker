apiVersion: v1
kind: Secret
metadata:
  name: barriofarma-secrets
  namespace: barriofarma
  labels:
    app.kubernetes.io/name: barriofarma
    app.kubernetes.io/component: secrets
type: Opaque
data:
  # Database credentials (base64 encoded)
  DB_PASSWORD: YmZkYjEyMw==  # bfdb123
  DB_ROOT_PASSWORD: YmZkYjEyMw==  # bfdb123
  
  # Redis passwords (if needed)
  REDIS_PASSWORD: ""  # Empty for now
  
  # Frappe admin credentials
  FRAPPE_ADMIN_PASSWORD: YWRtaW4=  # admin
  
  # Observability secrets (if using external services)
  OTEL_API_KEY: ""  # Empty for now, will be set by external secret management
  
  # Application secrets
  SECRET_KEY: ""  # Will be generated by init container
  ENCRYPTION_KEY: ""  # Will be generated by init container
