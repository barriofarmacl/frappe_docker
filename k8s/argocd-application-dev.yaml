apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: barriofarma-dev
  namespace: argocd
  labels:
    app.kubernetes.io/name: barriofarma
    app.kubernetes.io/component: application
    app.kubernetes.io/environment: dev
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/barriofarmacl/frappe_docker  # Actualizar con tu repo
    targetRevision: barriofarma-develop  # Rama dedicada para desarrollo de BarrioFarma
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: barriofarma
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10

