apiVersion: v1
kind: Service
metadata:
  name: barriofarma-backend-service
  namespace: barriofarma
  labels:
    app.kubernetes.io/name: barriofarma
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: barriofarma
    app.kubernetes.io/component: backend
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: barriofarma-frontend-service
  namespace: barriofarma
  labels:
    app.kubernetes.io/name: barriofarma
    app.kubernetes.io/component: frontend
spec:
  selector:
    app.kubernetes.io/name: barriofarma
    app.kubernetes.io/component: frontend
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: barriofarma-websocket-service
  namespace: barriofarma
  labels:
    app.kubernetes.io/name: barriofarma
    app.kubernetes.io/component: websocket
spec:
  selector:
    app.kubernetes.io/name: barriofarma
    app.kubernetes.io/component: websocket
  ports:
  - name: websocket
    port: 9000
    targetPort: 9000
    protocol: TCP
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: barriofarma
  labels:
    app: mariadb
    app.kubernetes.io/name: barriofarma
    app.kubernetes.io/component: database
spec:
  selector:
    app: mariadb
  ports:
  - name: mysql
    port: 3306
    targetPort: 3306
    protocol: TCP
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: redis-cache
  namespace: barriofarma
  labels:
    app: redis-cache
    app.kubernetes.io/name: barriofarma
    app.kubernetes.io/component: cache
spec:
  selector:
    app: redis-cache
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
    protocol: TCP
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: redis-queue
  namespace: barriofarma
  labels:
    app: redis-queue
    app.kubernetes.io/name: barriofarma
    app.kubernetes.io/component: queue
spec:
  selector:
    app: redis-queue
  ports:
