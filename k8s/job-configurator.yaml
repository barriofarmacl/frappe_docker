apiVersion: batch/v1
kind: Job
metadata:
  name: barriofarma-configurator
  namespace: barriofarma
  labels:
    app.kubernetes.io/name: barriofarma
    app.kubernetes.io/component: configurator
    app.kubernetes.io/version: "0.0.2-dev"
spec:
  ttlSecondsAfterFinished: 86400  # Eliminar job después de 24 horas
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: barriofarma
        app.kubernetes.io/component: configurator
        app.kubernetes.io/version: "0.0.2-dev"
    spec:
      restartPolicy: Never
      initContainers:
      # Ajustar permisos de los PVCs para el usuario frappe (UID 1000)
      - name: fix-permissions
        image: busybox
        securityContext:
          runAsUser: 0
        command: ['sh', '-c']
        args:
          - |
            echo "Ajustando permisos de PVCs para usuario frappe (UID 1000)...";
            chown -R 1000:1000 /sites /logs || true;
            chmod -R 755 /sites /logs || true;
            echo "Permisos ajustados";
        volumeMounts:
        - name: sites-data
          mountPath: /sites
        - name: logs-data
          mountPath: /logs
      # Verificar que Redis Cache está accesible
      - name: wait-for-redis-cache
        image: redis:7.2-alpine
        command: ['sh', '-c', 'REDIS_HOST=$(echo $FRAPPE_REDIS_CACHE | sed "s|redis://||" | cut -d: -f1); REDIS_PORT=$(echo $FRAPPE_REDIS_CACHE | sed "s|redis://||" | cut -d: -f2); until redis-cli -h $REDIS_HOST -p $REDIS_PORT ping; do echo waiting for redis-cache; sleep 2; done; echo "✅ Redis Cache conectado";']
        env:
        - name: FRAPPE_REDIS_CACHE
          valueFrom:
            configMapKeyRef:
              name: barriofarma-config
              key: FRAPPE_REDIS_CACHE
      # Verificar que Redis Queue está accesible
      - name: wait-for-redis-queue
        image: redis:7.2-alpine
        command: ['sh', '-c', 'REDIS_HOST=$(echo $FRAPPE_REDIS_QUEUE | sed "s|redis://||" | cut -d: -f1); REDIS_PORT=$(echo $FRAPPE_REDIS_QUEUE | sed "s|redis://||" | cut -d: -f2); until redis-cli -h $REDIS_HOST -p $REDIS_PORT ping; do echo waiting for redis-queue; sleep 2; done; echo "✅ Redis Queue conectado";']
        env:
        - name: FRAPPE_REDIS_QUEUE
          valueFrom:
            configMapKeyRef:
              name: barriofarma-config
              key: FRAPPE_REDIS_QUEUE
      containers:
      - name: configurator
        image: gcr.io/barriofarma-dev/bf-app-dev:0.0.2-dev
        imagePullPolicy: Always
        command:
        - bash
        - -c
        - |
          # Verificar conexión directa a MySQL 8.0 (Cloud SQL con IP privada)
          echo "Verificando conexión directa a MySQL 8.0...";
          until mariadb --skip-ssl -h "$DB_HOST" -u barriofarma -p"$DB_PASSWORD" -e "SELECT VERSION()" >/dev/null 2>&1; do
            echo "Esperando conexión a MySQL 8.0...";
            sleep 2;
          done;
          echo "✅ Conexión directa a MySQL 8.0 verificada";
          # Crear archivo de configuración inicial si no existe
          if [ ! -f sites/common_site_config.json ]; then
            echo "{}" > sites/common_site_config.json;
            echo "Archivo common_site_config.json creado";
          fi;
          # Crear directorio de logs si no existe
          mkdir -p logs;
          # Listar apps disponibles
          ls -1 apps > sites/apps.txt || echo "apps.txt creado";
          # Configurar conexión directa a MySQL 8.0 (Cloud SQL con IP privada)
          bench set-config -g db_host $DB_HOST;
          bench set-config -gp db_port $DB_PORT;
          # Configurar conexión a Redis Cache
          bench set-config -g redis_cache "$FRAPPE_REDIS_CACHE";
          # Configurar conexión a Redis Queue
          bench set-config -g redis_queue "$FRAPPE_REDIS_QUEUE";
          bench set-config -g redis_socketio "$FRAPPE_REDIS_QUEUE";
          # Configurar puerto de SocketIO
          bench set-config -gp socketio_port $SOCKETIO_PORT;
          # Cloud SQL requiere SSL (ENCRYPTED_ONLY), pero conexión directa funciona sin SSL explícito
          # Frappe manejará SSL automáticamente si está configurado
          bench set-config -g use_ssl 0;
          # Configurar credenciales "root" del proyecto (usuario barriofarma con permisos completos)
          # Este usuario actúa como root para el proyecto, permitiendo crear bases de datos y usuarios
          bench set-config -g root_login barriofarma;
          bench set-config -gp root_password "$DB_PASSWORD";
          # Verificar que la configuración se escribió correctamente
          echo "=== Verificando configuración ===";
          cat sites/common_site_config.json | jq . || cat sites/common_site_config.json;
          echo "=== Configuración completada exitosamente ===";
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: barriofarma-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: barriofarma-config
              key: DB_PORT
        - name: FRAPPE_REDIS_CACHE
          valueFrom:
            configMapKeyRef:
              name: barriofarma-config
              key: FRAPPE_REDIS_CACHE
        - name: FRAPPE_REDIS_QUEUE
          valueFrom:
            configMapKeyRef:
              name: barriofarma-config
              key: FRAPPE_REDIS_QUEUE
        - name: SOCKETIO_PORT
          value: "9000"
        - name: DB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: barriofarma-secrets
              key: DB_ROOT_PASSWORD
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: barriofarma-secrets
              key: DB_PASSWORD
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: sites-data
          mountPath: /home/frappe/frappe-bench/sites
        - name: logs-data
          mountPath: /home/frappe/frappe-bench/logs
      volumes:
      - name: sites-data
        persistentVolumeClaim:
          claimName: barriofarma-sites-pvc
      - name: logs-data
        persistentVolumeClaim:
          claimName: barriofarma-logs-pvc

