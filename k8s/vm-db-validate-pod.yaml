apiVersion: v1
kind: Pod
metadata:
  name: vm-db-validate
  namespace: barriofarma-uat
spec:
  restartPolicy: Never
  containers:
    - name: check
      image: mariadb:11.8
      env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: barriofarma-config
              key: DB_HOST
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: barriofarma-secrets
              key: DB_PASSWORD
      command:
        - sh
        - -c
        - |
          set -e
          echo "From cluster to VM: host=$DB_HOST"
          mariadb --skip-ssl -h"$DB_HOST" -ubarriofarma -p"$DB_PASSWORD" \
            -e "SELECT VERSION() AS version, CURRENT_USER() AS user;" 2>&1
          echo "OK: TCP+auth to MariaDB VM"
