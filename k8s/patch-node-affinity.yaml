spec:
  template:
    spec:
      nodeSelector:
        barriofarma/shared-storage: "true"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: barriofarma-queue-short
  namespace: barriofarma
spec:
  template:
    spec:
      nodeSelector:
        barriofarma/shared-storage: "true"

---
apiVersion: batch/v1
kind: Job
